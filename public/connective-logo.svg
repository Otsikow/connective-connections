<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Connective brand artwork</title>
  <desc id="desc">Gradient orb with interlocking conversation marks forming the letter C</desc>
  <defs>
    <radialGradient id="orb" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>
    <linearGradient id="beam" x1="18%" y1="18%" x2="82%" y2="82%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="loop" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
  </defs>
  <rect width="1080" height="1080" rx="260" fill="url(#orb)" />
  <path
    d="M780 420c42 86 27 190-48 258-94 86-244 86-338 0s-94-226 0-312 244-86 338 0"
    fill="none"
    stroke="url(#loop)"
    stroke-width="78"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft)"
  />
  <path
    d="M804 468c36 72 26 158-28 212"
    fill="none"
    stroke="url(#beam)"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="446" cy="420" r="34" fill="#facc15" />
  <circle cx="650" cy="628" r="34" fill="#facc15" />
  <path
    d="M386 636c-34 0-62 28-62 62v36c0 16-13 28-28 28-10 0-18 8-18 18s8 18 18 18h90c34 0 62-28 62-62v-38c0-34-28-62-62-62z"
    fill="rgba(15,23,42,0.28)"
  />
